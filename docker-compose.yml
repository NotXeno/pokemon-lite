version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # Main port to communicate with the Python
      - "15672:15672" # Management port for RabbitMQ UI
    restart: always 